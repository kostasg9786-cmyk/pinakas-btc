{"name":"Pinakas BTC","on":{"schedule":[{"cron":"5 * * * *"}],"workflow_dispatch":{},"push":{"branches":["main"],"paths":["fetch_data.py",".github/workflows/pinakas.yml"]}},"permissions":{"contents":"write","issues":"write"},"jobs":{"anagnosi":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"run":"pip install -r requirements.txt"},{"run":"python fetch_data.py","env":{"FRED_API_KEY":"${{ secrets.FRED_API_KEY }}"}},{"run":"git config user.name pinakas-bot && git config user.email pinakas-bot@users.noreply.github.com && git add data.json history.csv alert.json && (git commit -m anagnosi || echo no-changes) && (git push || echo push-failed)"},{"run":"if [ \"$(python -c 'import json;print(json.load(open(\"alert.json\"))[\"changed\"])')\" = \"True\" ]; then TITLE=$(python -c 'import json;a=json.load(open(\"alert.json\"));print(\"Pinakas BTC: \"+a[\"cell\"]+\" x\"+str(a[\"mult\"]))'); BODY=$(python -c 'import json;a=json.load(open(\"alert.json\"));print(\"\\n\".join(\"- \"+c for c in a[\"changes\"])+\"\\n\\n\"+a[\"stance\"]+\"\\n\\nSimaies: \"+(\", \".join(a[\"flags\"]) or \"-\")+\"\\n\\nhttps://kostasg9786-cmyk.github.io/pinakas-btc/\")'); gh issue create --title \"$TITLE\" --body \"$BODY\" --assignee kostasg9786-cmyk; else echo kamia-allagi; fi","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"}}]}}}
